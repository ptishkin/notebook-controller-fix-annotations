name: build-image

on:
  push:
    branches: [main, patch/merge-annotations]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/notebook-controller

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.17
    steps:
      - uses: actions/checkout@v4
      - name: go vet
        working-directory: notebook-controller
        run: go vet ./...
      - name: go test (annotation-merge fix)
        working-directory: notebook-controller
        run: go test ./tests/ -v -count=1

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v1.10.0-patch.1,enable=${{ github.ref == 'refs/heads/patch/merge-annotations' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: notebook-controller/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
